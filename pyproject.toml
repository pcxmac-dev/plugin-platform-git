[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-git"
version = "0.1.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Git for Liminal: Git's version and the repositories under the folders you name, each read from its own files, and a plain Git server over SSH run in a container through the container plugin you pick."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.2); 1.94.0: ContainedService, the
# base its server is built on (in containers alone, through a container plugin's plans)
dependencies = ["liminal-libs>=1.94.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
git = "plugin_platform_git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
